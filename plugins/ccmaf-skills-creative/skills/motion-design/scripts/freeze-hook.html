<!--
  freeze-hook.html — paste this block just before </body> while iterating.
  Open anim.html?t=2.5 to see the exact frame at 2.5 s; ?f=60&fps=24 works too.
  Add &hud=1 to overlay the frame number for screenshots and notes.
  Remove before the final render if you don't want the query hook shipped.
-->
<script>
(function () {
  var q = new URLSearchParams(location.search);
  if (!q.has('t') && !q.has('f')) return;
  var fps = parseFloat(q.get('fps')) || 24;
  var t = q.has('f') ? (parseFloat(q.get('f')) || 0) / fps : (parseFloat(q.get('t')) || 0);
  function freeze() {
    if (typeof window.renderAt === 'function') window.renderAt(t);
    document.getAnimations().forEach(function (a) { a.pause(); a.currentTime = t * 1000; });
    if (q.get('hud') === '1') {
      var el = document.getElementById('__hud') || document.body.appendChild(Object.assign(document.createElement('div'), { id: '__hud' }));
      el.style.cssText = 'position:fixed;right:8px;bottom:8px;font:12px/1 monospace;background:#000;color:#fff;padding:4px 6px;z-index:99999';
      el.textContent = 'f ' + Math.round(t * fps) + ' · ' + t.toFixed(3) + ' s';
    }
  }
  freeze();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(freeze);
  window.addEventListener('load', freeze);
})();
</script>
